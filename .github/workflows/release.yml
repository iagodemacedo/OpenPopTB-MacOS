# Builds the downloadable app and attaches it to the GitHub release.
# The CI never sees game files: the apps contain only the runtime and the recompiler, and recompile
# the player's own copy on first launch (runtime/prepare.c).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Homebrew bottles target the runner's macOS, which sets the app's minimum macOS version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      # Checked first: a tag whose version has no CHANGELOG.md section fails before the long build
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: tools/release_notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Tools
        run: brew install cmake ninja sdl3 innoextract
      # Signing and notarization run only when the secrets exist (forks build an ad-hoc signed app)
      - name: Signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "no DEVELOPER_ID_P12 secret: ad-hoc build"; exit 0; }
          KC="$RUNNER_TEMP/sign.keychain-db"; KCPW=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$ID" ] || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"
      - name: Package
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          [ -n "$SIGN_ID" ] || unset NOTARY_APPLE_ID
          tools/package_release.sh
      - name: Check Gatekeeper
        if: env.SIGN_ID != ''
        run: |
          for a in "dist/release/Populous TB.app" "dist/release/Populous UW.app" "dist/release/Populous TB (Direct3D).app"; do
            spctl -a -vv -t exec "$a"; xcrun stapler validate "$a"
          done
      - name: Show what was packaged
        run: |
          APP="dist/release/Populous TB.app"
          plutil -p "$APP/Contents/Info.plist" | grep -E "LSMinimumSystemVersion|CFBundleShortVersionString"
          "$APP/Contents/MacOS/innoextract" --version | head -1
          ls "$APP/Contents/Resources/recomp" "$APP/Contents/Resources/include"
      - uses: actions/upload-artifact@v7
        with:
          name: OpenPopTB-MacOS
          path: dist/OpenPopTB-MacOS-*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/OpenPopTB-MacOS-*.zip --clobber
